name: Bilder generieren

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Eigener Prompt (leer lassen, um ein Preset zu nutzen)"
        required: false
        default: ""
      preset:
        description: "Preset aus prompts/presets.yaml (oder 'alle')"
        required: false
        default: "portrait"
      model:
        description: "Hugging Face Modell-ID"
        required: false
        default: "black-forest-labs/FLUX.1-schnell"
      seed:
        description: "Seed (leer = zufällig)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Bilder erzeugen
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PROMPT: ${{ inputs.prompt }}
          PRESET: ${{ inputs.preset }}
          MODEL: ${{ inputs.model }}
          SEED: ${{ inputs.seed }}
        run: |
          args=(--model "$MODEL")
          [ -n "$SEED" ] && args+=(--seed "$SEED")
          if [ -n "$PROMPT" ]; then
            python generate.py --prompt "$PROMPT" "${args[@]}"
          elif [ "$PRESET" = "alle" ]; then
            python generate.py --all-presets "${args[@]}"
          else
            python generate.py --preset "$PRESET" "${args[@]}"
          fi

      - name: Als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: bilder
          path: outputs/*.png

      - name: Ins Repo committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/
          git diff --cached --quiet || git commit -m "Neue Bilder generiert"
          git push
